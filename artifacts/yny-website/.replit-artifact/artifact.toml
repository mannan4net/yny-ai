kind = "web"
previewPath = "/"
title = "YnY Platforms Website"
version = "1.0.0"
id = "artifacts/yny-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25180

[services.development]
run = "pnpm --filter @workspace/yny-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/yny-website", "run", "build" ]
publicDir = "artifacts/yny-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25180"
BASE_PATH = "/"
